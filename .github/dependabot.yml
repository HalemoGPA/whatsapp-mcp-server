version: 2
updates:
  # Python MCP server. The uv ecosystem updates uv.lock together with the
  # pyproject.toml floor. The pip ecosystem only edited pyproject.toml, which
  # left the lock, and the Docker image built from it, behind.
  - package-ecosystem: uv
    directory: /whatsapp-mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Go bridge
  - package-ecosystem: gomod
    directory: /whatsapp-bridge
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
