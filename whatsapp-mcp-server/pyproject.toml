[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "Private, authenticated WhatsApp MCP server (HTTP transport)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.6",
    # `[standard]` pulls in uvloop + httptools + websockets - real perf wins
    # on Linux/x86 over the pure-Python defaults; uvicorn picks them up
    # automatically when present.
    "uvicorn[standard]>=0.52.1",
    # Bridge and provider calls all go through requests.Session (keep-alive).
    # httpx arrives transitively via fastmcp but nothing here imports it, so it
    # is deliberately NOT declared - an undeclared import is a bug, and a
    # declared non-import is a lie about what this package needs.
    "requests>=2.34.2",
    "prometheus-client>=0.26.0",
    # media.py: HKDF + AES-CBC to decrypt WhatsApp CDN blobs directly. Already
    # present transitively via fastmcp, but declared because we import it
    # directly - a transitive pull is not a contract.
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

# Tool config (pytest, ruff) lives in the repo-root pyproject.toml, because the
# offline test suite spans both this package and tests/.
