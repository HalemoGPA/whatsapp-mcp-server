# nginx vhost for whatsapp-mcp.example.com
# Place at /etc/nginx/sites-available/whatsapp-mcp and symlink into sites-enabled.
#
# IMPORTANT: this box already runs other sites behind Cloudflare. The TLS lines
# below (ssl_certificate / ssl_certificate_key) are PLACEHOLDERS - replace them
# with the SAME cert paths an existing vhost uses (Cloudflare Origin
# cert). Inspect first:
#
#   grep -RIl your-domain /etc/nginx/sites-available/ /etc/nginx/sites-enabled/
#   # read a sibling vhost; copy its ssl_certificate* lines here.
#
# If the box instead uses certbot/Let's Encrypt, OMIT the 443 block entirely,
# install this file with only the :80 server, run certbot --nginx -d
# whatsapp-mcp.example.com, and let certbot inject the 443 block.
#
# After any change:  nginx -t  &&  systemctl reload nginx   (never restart)

limit_req_zone $binary_remote_addr zone=wamcp:10m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name whatsapp-mcp.example.com;

    # ACME challenge dir (harmless if unused; needed if you use certbot).
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Redirect everything else to HTTPS (Cloudflare also enforces this).
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whatsapp-mcp.example.com;

    # Cloudflare Origin certificate (*.example.com, valid through 2041).
    # Same cert/key used by another.example.com and other siblings on this box.
    ssl_certificate     /etc/ssl/example.com/cert.pem;
    ssl_certificate_key /etc/ssl/example.com/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/whatsapp-mcp.example.com.access.log;
    error_log  /var/log/nginx/whatsapp-mcp.example.com.error.log;

    # Unauthenticated liveness probe (the app authenticates everything else).
    location = /health {
        proxy_pass http://127.0.0.1:9100/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # MCP clients (Claude Desktop, Anthropic SDK) probe OAuth discovery
    # before falling back to plain bearer. Proxy the .well-known paths to
    # the MCP app so it can respond with proper JSON instead of nginx's
    # HTML 404 - the SDK JSON-parses those and dies on the '<' otherwise.
    # ACME challenges (Let's Encrypt) still work because they land in the
    # :80 server block above; here we only proxy anything the app must own.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location ^~ /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
    location ^~ /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:9100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # MCP Streamable-HTTP endpoint. Auth is enforced by the app (bearer token).
    location /mcp {
        limit_req zone=wamcp burst=100;

        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through MCP/auth headers explicitly.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Accept $http_accept;

        # Streamable HTTP: do not buffer, allow long-lived responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

        proxy_hide_header X-Powered-By;
    }

    # Signed media download links (save_media). Intentionally NOT bearer-gated:
    # the user's browser opens these and cannot send an Authorization header, so
    # the HMAC signature in the path IS the credential (S3-presigned model).
    # The app enforces the signature and the expiry; nginx just proxies.
    location /media/ {
        # Tighter burst than /mcp: these are human click-throughs, not an LLM
        # loop. Also caps signature guessing, though HMAC-SHA256 makes that
        # academic.
        limit_req zone=wamcp burst=20 nodelay;

        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Unlike /mcp, buffering stays ON: these are finite file bodies, and
        # letting nginx absorb them frees the uvicorn worker immediately.
        proxy_buffering on;
        proxy_read_timeout 300s;

        # Private media must never be cached by an intermediary - belt-and-braces
        # in case the DNS record is ever flipped back to an orange (proxied)
        # Cloudflare record. The app sets this too; hide its copy so the header
        # appears exactly once rather than duplicated.
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header X-Powered-By;
    }

    # Short media links (/s/<code>) - same handling as /media/, just a shorter
    # path. The code is the credential; the app enforces expiry.
    location /s/ {
        limit_req zone=wamcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header X-Powered-By;
    }

    # Short PREVIEW links (/p/<code>) - same as /s/ but the app serves them
    # inline so the browser renders the media instead of downloading.
    location /p/ {
        limit_req zone=wamcp burst=20 nodelay;
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_read_timeout 300s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
        proxy_hide_header X-Powered-By;
    }

    server_tokens off;
    client_max_body_size 16m;     # allow media uploads via send_file
}
