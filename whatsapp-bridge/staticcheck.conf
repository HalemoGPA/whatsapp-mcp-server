# staticcheck configuration for the Go bridge.
#
# This is staticcheck's documented default check set, with one check removed:
# SA1019 (use of a deprecated symbol). Every SA1019 hit here is the same one -
# whatsmeow deprecated its `binary/proto` package in favour of the newer
# `proto/wa*` packages. The pinned whatsmeow version still fully supports the
# old package, so it is library churn, not a defect; migrating every reference
# is a separate mechanical change. Every other real check (unused code,
# ineffectual assignments, suspicious constructs) stays on and strict.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-SA1019"]
